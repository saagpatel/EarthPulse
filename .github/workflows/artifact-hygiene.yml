name: Artifact Hygiene

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-tracked-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify No Generated Artifacts Are Tracked
        run: bash ./scripts/check-tracked-artifacts.sh
